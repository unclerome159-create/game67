# Хроноакадемия — Docker Compose
#
#   Production-like:   docker compose up --build app
#   Hot-reload dev:    docker compose --profile dev up dev
#
# GEMINI_API_KEY is read from the shell or from a .env file next to this file
# (Compose performs variable interpolation automatically).

services:
  app:
    build:
      context: .
      target: runtime
    image: chronoacademy:latest
    container_name: chronoacademy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
    restart: unless-stopped

  dev:
    image: oven/bun:1-alpine
    container_name: chronoacademy-dev
    working_dir: /app
    command: sh -c "bun install --frozen-lockfile && bun run dev"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      # Keep container dependencies isolated from the host checkout.
      - chrono_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    profiles:
      - dev

volumes:
  chrono_node_modules:
